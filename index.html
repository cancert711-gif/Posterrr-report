<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電影特典即時回報站</title>
  <style>
    :root {
      --primary: #e50914;
      --bg: #141414;
      --card-bg: #1f1f1f;
      --text: #ffffff;
      --text-sub: #b3b3b3;
      --border: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    input[type="file"] {
      padding: 7px;
      background: #2b2b2b;
      cursor: pointer;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .status-available { background: #2e7d32; color: #fff; }
    .status-few { background: #ed6c02; color: #fff; }
    .status-empty { background: #d32f2f; color: #fff; }
    
    .chain-badge {
      display: inline-block;
      background: #333;
      color: #ffcc00;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      margin-right: 6px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .item-title {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .meta {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 6px;
    }
    .report-img {
      max-width: 100%;
      height: auto;
      max-height: 200px;
      border-radius: 4px;
      margin-top: 10px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 電影特典即時回報站</h1>

  <!-- 回報表單 -->
  <div class="card">
    <h2>回報特典與庫存狀況</h2>
    <form id="reportForm">
      <div class="form-group">
        <label for="movieName">電影名稱</label>
        <input type="text" id="movieName" placeholder="例如：劇場版 藍色監獄" required>
      </div>

      <div class="form-group">
        <label for="cinemaChain">選擇院線</label>
        <select id="cinemaChain" required>
          <option value="">請選擇院線...</option>
          <option value="英皇院線">英皇院線 (Emperor Cinemas)</option>
          <option value="MCL院線">MCL 院線</option>
          <option value="高先電影">高先 (Golden Scene)</option>
          <option value="影藝院線">影藝 (Cine-Art House)</option>
          <option value="其他管道">其他 / 網上平台</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cinemaName">戲院名稱 / 分店</label>
        <input type="text" id="cinemaName" placeholder="例如：尖沙咀 iSQUARE / 德福戲院 / 堅尼地城" required>
      </div>

      <div class="form-group">
        <label for="perkDesc">特典內容描述</label>
        <input type="text" id="perkDesc" placeholder="例如：A3雙面角色海報、透卡特典" required>
      </div>

      <div class="form-group">
        <label for="perkImage">上傳特典照片</label>
        <input type="file" id="perkImage" accept="image/*">
      </div>

      <div class="form-group">
        <label for="status">目前存貨狀況</label>
        <select id="status">
          <option value="available">熱烈發放中 (名額充裕)</option>
          <option value="few">即將完售 (數量有限)</option>
          <option value="empty">已發完 / 派發完畢</option>
        </select>
      </div>

      <div class="form-group">
        <label for="note">補充說明（可選）</label>
        <input type="text" id="note" placeholder="例如：需出示票根、每張飛限領一份">
      </div>

      <button type="submit">送出回報</button>
    </form>
  </div>

  <!-- 最新回報列表 -->
  <h2>最新回報列表</h2>
  <div id="reportList"></div>
</div>

<script>
  // 模擬初期數據
  let reports = [
    {
      movie: "劇場版 咒術迴戰",
      chain: "MCL院線",
      location: "德福戲院",
      perk: "第一週入場特典 A4 透明膠夾",
      status: "few",
      statusText: "即將完售",
      note: "下午場次排隊人潮多，職員表示所餘無幾",
      image: "",
      time: "15 分鐘前"
    }
  ];

  function renderReports() {
    const listEl = document.getElementById('reportList');
    listEl.innerHTML = '';

    reports.forEach(r => {
      let badgeClass = 'status-available';
      if(r.status === 'few') badgeClass = 'status-few';
      if(r.status === 'empty') badgeClass = 'status-empty';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="item-header">
          <span class="item-title">${r.movie}</span>
          <span class="status-badge ${badgeClass}">${r.statusText}</span>
        </div>
        <div class="meta">
          <span class="chain-badge">${r.chain}</span> 📍 <strong>${r.location}</strong>
        </div>
        <div style="margin-top: 6px;">🎁 <strong>特典：</strong> ${r.perk}</div>
        ${r.note ? `<div style="margin-top:4px; font-size:0.9rem; color:#ccc;">💬 <strong>備註：</strong> ${r.note}</div>` : ''}
        ${r.image ? `<div style="margin-top:8px;"><img src="${r.image}" class="report-img" alt="特典照片"></div>` : ''}
        <div class="meta" style="margin-top: 10px;">⏰ 回報時間：${r.time}</div>
      `;
      listEl.appendChild(card);
    });
  }

  document.getElementById('reportForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const movie = document.getElementById('movieName').value;
    const chain = document.getElementById('cinemaChain').value;
    const location = document.getElementById('cinemaName').value;
    const perk = document.getElementById('perkDesc').value;
    const statusSelect = document.getElementById('status');
    const status = statusSelect.value;
    const statusText = statusSelect.options[statusSelect.selectedIndex].text.split(' ')[0];
    const note = document.getElementById('note').value;
    const imageInput = document.getElementById('perkImage');

    function saveAndRender(imageUrl = '') {
      reports.unshift({
        movie,
        chain,
        location,
        perk,
        status,
        statusText,
        note,
        image: imageUrl,
        time: "剛剛"
      });
      renderReports();
      document.getElementById('reportForm').reset();
    }

    // 處理圖片上傳轉為 Base64 顯示
    if (imageInput.files && imageInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveAndRender(e.target.result);
      };
      reader.readAsDataURL(imageInput.files[0]);
    } else {
      saveAndRender('');
    }
  });

  // 初次渲染
  renderReports();
</script>

</body>
</html>
