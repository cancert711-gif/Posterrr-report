<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電影特典即時回報站</title>
  <style>
    :root {
      --primary: #e50914;
      --bg: #141414;
      --card-bg: #1f1f1f;
      --text: #ffffff;
      --text-sub: #b3b3b3;
      --border: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    input[type="file"] {
      padding: 7px;
      background: #2b2b2b;
      cursor: pointer;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .clear-btn {
      background-color: #444;
      margin-top: 10px;
    }
    
    .filter-section {
      background: #181818;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .filter-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--text-sub);
    }
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filter-btn {
      background: #2b2b2b;
      color: #ccc;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      width: auto;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .status-available { background: #2e7d32; color: #fff; }
    .status-few { background: #ed6c02; color: #fff; }
    .status-empty { background: #d32f2f; color: #fff; }
    
    .chain-badge {
      display: inline-block;
      background: #333;
      color: #ffcc00;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      margin-right: 6px;
    }
